<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Darts Points</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section>
      <h2>Darts Points</h2>
      <h3>Points:</h3>
      <div id="newScoreInput">
        <input
          type="text"
          inputmode="numeric"
          id="score"
          name="score"
          placeholder="0"
          min="1"
          max="180"
        />
      </div>
      <h5>Score Counter</h5>
        <!--Asetetaan taulukot horisontaalisesti-->
      <div class="scoreboard">
        <div id="player1Name">Player 1 name here</div>
        <div id="player1LegWins">Number of legs won here</div>
        <table id="player1Score">
          <tr>
            <td></td><td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td><td></td>
          </tr>
        </table>
      </div>
      <div class="scoreboard">
        <div id="player2Name">Player 2 name here</div>
        <div id="player1LegWins">Number of legs won here</div>
        <table id="player2Score">
          <tr>
            <td></td><td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td><td></td>
          </tr>
        </table>
      </div>
      <div class="scoreboard">
        <div id="player3Name">Player 3 name here</div>
        <div id="player1LegWins">Number of legs won here</div>
        <table id="player3Score">
          <tr>
            <td></td><td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td><td></td>
          </tr>
        </table>
      </div>
      <div class="scoreboard">
        <div id="player4Name">Player 4 name here</div>
        <div id="player1LegWins">Number of legs won here</div>
        <table id="player4Score">
          <tr>
            <td></td><td></td><td></td><td></td><td></td>
            <td></td><td></td><td></td><td></td><td></td>
          </tr>
        </table>
      </div>
      <button id="resetGame" type="button">Reset Game</button>
      <script src="scorecounter.js"></script>
    </section>
  </body>
</html>
