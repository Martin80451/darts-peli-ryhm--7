<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Darts Point Calculator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <section>
      <div class="header">
        <h2>Darts Points Calculator</h2>
        <div id="GameSettings">
          <button id="changeSettings" type="button">⚙</button>
        </div>
      </div>
      <h3>Points:</h3>
      <div id="newScoreInput">
        <input
          type="text"
          inputmode="numeric"
          id="score"
          name="score"
          placeholder="0"
          min="1"
          max="180"
        />
      </div>
      <div id="currentSet">
        <h5 id="set">Current set: *tähän*</h5>
      </div>
      <!--Asetetaan taulukot horisontaalisesti-->
      <div class="scoreboard">
        <div class="titles">
          <left><p2>Players</p2></left>
          <right><p2>Points Left</p2><p2>Wins</p2></right>
        </div>
        <div class="toprow">
          <div id="player1Name">Player 1 name here</div>
          <div id="player1pointsLeft">8</div>
          <div id="player1wins">0</div>
        </div>
        <table id="player1Score">
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </table>
      </div>
      <div class="scoreboard">
        <div class="toprow">
          <div id="player2Name">Player 2 name here</div>
          <div id="player2pointsLeft">100</div>
          <div id="player2wins">2</div>
        </div>
        <table id="player2Score">
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </table>
      </div>
      <div class="scoreboard">
        <div class="toprow">
          <div id="player3Name">Player 3 name here</div>
          <div id="player3pointsLeft">555</div>
          <div id="player3wins">3</div>
        </div>
        <table id="player3Score">
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </table>
      </div>
      <div class="scoreboard">
        <div class="toprow">
          <div id="player4Name">Player 4 name here</div>
          <div id="player4pointsLeft">333</div>
          <div id="player4wins">1</div>
        </div>
        <table id="player4Score">
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </table>
      </div>
      <!-- POPUP -->
      <div id="overlay" class="overlay">
        <div class="settingsPopup">
          <p class="popup-text">Settings</p>
          <button id="resetGame" type="button">Reset Game</button>
          <!-----------------------------------------------------------Reset button-->
          <button id="mainmenu" type="button">Main Menu</button>
          <!-----------------------------------------------------------Main menu button-->
          <button id="closeButton" class="closePopup">Back</button>
        </div>
      </div>

      <script type="module" src="scripts/javascript/scorecounter.js"></script>
    </section>
  </body>
</html>
