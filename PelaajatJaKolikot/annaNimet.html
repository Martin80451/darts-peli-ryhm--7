<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Darts Points</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    
  </head>
  <body>
    <section>
    <h1>Darts Points</h1>
    <form id="startGameForm">
      <h3>Choose players:</h3>
      <input
        id="player1"
        class="player"
        label for="Player 1 name"
        placeholder="Player 1"
        name="player1"
        type="text"
      />
      <input
        id="player2"
        class="player"
        label for="Player 2 name"
        placeholder="Player 2"
        name="player2"
        type="text"
      />
        <input
        id="player3"
        class="player"
        label for="Player 3 name"
        placeholder="Player 3"
        name="player3"
        type="text"
      />
      <input
        id="player4"
        class="player"
        label for="Player 4 name"
        placeholder="Player 4"
        name="player4"
        type="text"
      />
        <h4>Current settings:</h4>
        <div id="currentPlayers"> Players: </div>
        <div id="currentGameType"> Game Type: </div>
        <div id="currentSetSize">Set Size: </div>

        <button id="startGame" type="button">Start Game</button>
    </form>
    <script src="annaNimet.js" defer></script>
    </section>
        <!-- POPUP -->
    <div id="overlay" class="overlay">
        <div class="popup">
            <img id="popupImg" src="" class="popup-image" alt="" />
            <p class="popup-text">pelaaja <span id="popupPlayerNum"></span> aloittaa</p>
            <button class="closePopup" onclick="closePopup()">OK</button>
        </div>
    </div>

  </body>
</html>
