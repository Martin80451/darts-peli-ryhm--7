<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Point Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class ="container">
        <h2>Dart Point Calculator</h2>
        Player/Team Count: <input type="number" id="playerCount" placeholder="Enter number of players/teams" min="1"><br>

        Game Type: <select id="gameType">
            <option value="301">301</option>
            <option value="501">501</option>
        </select><br>
        Set Size: <select id="setSize">
            <option value="1">1 Set</option>
            <option value="3">3 Sets</option>
            <option value="5">5 Sets</option>
        </select>
        <br>
        <br>
        <button id="startCalculate">Start Game</button>
    </div>
</body>
</html>
