<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Darts Point Calculator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <section>
    <h1>Darts Point Calculator</h1>
    <form id="startGameForm">
      <h3>Players:</h3>
      <label for="numPlayers">Select number of players (1-4):</label>
      <input
        id="numPlayers"
        type="number"
        name="numPlayers"
        min="1"
        max="4"
        value="1"
      />
      <br/>
      <label for="randomizePlayersCheck">Randomize first player:</label>
      <input
        id="randomizePlayersCheck"
        type="checkbox"
        name="randomizePlayersCheck"
      />

      <h3>Select game type:</h3>
      <select id="gameType" name="gameType" class="gameTypeSelection">
        <option value="301">301</option>
        <option value="501">501</option>
      </select>

      <h3>Select set size:</h3>
      <input id="setSize" type="number" name="setSize" min="1" max="10" value="3" />
      <button id="startGame" type="button">Start Game</button>
      </form>

      <div id="settingsPopupBackground">
        <div class="settingPopup">
          <div id="popupContent"></div>
          <button id="closePopup">Close</button>
          <button id="continuePopup">Continue</button>
        </div>
      </div>

      <script src="scripts/javascript/popupScript.js"></script>
    </section>
  </body>
</html>
