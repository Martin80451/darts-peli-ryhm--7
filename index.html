<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Darts Point Calculator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <section>
      <h1>Darts Point Calculator</h1>
      <form id="startGameForm">
        <h3>Players:</h3>
        <label for="numPlayers">Select number of players (2-4):</label>
        <input
          id="numPlayers"
          type="number"
          name="numPlayers"
          min="2"
          max="4"
          value="2"
        />
        <div id="userInputs">
          <div id="twoPlayers">
          <input
            id="player1"
            class="player"
            label
            for="Player 1 name"
            placeholder="Player 1"
            name="player1"
            type="text"
            maxlength="20"
          />
          <input
            id="player2"
            class="player"
            label
            for="Player 2 name"
            placeholder="Player 2"
            name="player2"
            type="text"
            maxlength="20"
          /></div>
          <div id="additionalPlayers">
          <input
            id="player3"
            class="player"
            label
            for="Player 3 name"
            placeholder="Player 3"
            name="player3"
            type="text"
            maxlength="20"
          />
          <input
            id="player4"
            class="player"
            label
            for="Player 4 name"
            placeholder="Player 4"
            name="player4"
            type="text"
          />
        </div>
        <div>
        <label for="randomizePlayersCheck">Randomize first player:</label>
        <input
          id="randomizePlayersCheck"
          type="checkbox"
          name="randomizePlayersCheck"
        /></div>

        <h3>Select game type:</h3>
          <form id="gameForm">
            <input type="hidden" id="gameType" name="gameType">  <!-- piilotettu kenttä johon gametype tallennetaan -->
            <div>
            <button class="gameTypeButton" id="button301" type="button" value="301">301 up</button>
            <button class="gameTypeButton" id="button501" type="button" value="501">501 up</button>
          </div>
        </form>

        <h3>Select set size:</h3>
        <input
          id="setSize"
          type="number"
          name="setSize"
          min="1"
          max="10"
          value="3"
        />
        <button id="startGame" type="button">Start Game</button>
      </form>

      <div id="settingsPopupBackground">
        <div class="settingsPopup">
          <div id="popupContent"></div>
          <button id="closePopup", class="closePopup">Close</button>
          <button id="continuePopup", class="continuePopup">Continue</button>
        </div>
      </div>
    </section>
    <div id="overlay" class="overlay">
      <div class="menuPopup">
        <img id="popupImg" src="" class="popup-image" alt="" />
        <p class="popup-text"><span id="popupPlayerNum"></span> aloittaa</p>
        <button id="closePopupPlayerChosen">OK</button>
      </div>
    </div>
    <script type="module" src="scripts/javascript/index.js"></script>
  </body>
</html>
