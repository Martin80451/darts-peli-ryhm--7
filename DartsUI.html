<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Darts Game</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Darts Game</h1>
    <form id="startGameForm">
      <h3>Choose players:</h3>
      <input
        id="player1"
        class="player"
        label="Player 1 name"
        placeholder="Player 1"
        name="player1"
      />
      <input
        id="player2"
        class="player"
        label="Player 2 name"
        placeholder="Player 2"
        name="player2"
      />
      <h3>Select game type:</h3>
      <button class="gameTypeButton" id="button1" type="button">301 up</button>
      <button class="gameTypeButton" id="button2" type="button">501 up</button>
      <h3>Select set size:</h3>
      <input type="number" name="setSize" min="1" max="100" value="3" />
      <button id="startGame">Start Game</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
